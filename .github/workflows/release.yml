# A tagged release: build the installers on the host each target needs, then
# attach them to a GitHub Release.
#
# Why the split:
#   - macOS reaches Cocoa and Metal through cgo and an Objective-C bridge, which
#     cannot be cross-compiled. Viva says so itself ("building for darwin needs a
#     macOS host"), and it is why the darwin job runs on macos-latest.
#   - Linux and Windows builds use no cgo, so one ubuntu job covers both, and
#     both architectures.
#
# Nothing is signed: the Linux packages and the Windows zip are unsigned, so a
# downloaded installer warns. Signing is opt-in in viva (APPLE_SIGNING_IDENTITY
# and friends); the secrets are read here if they exist, so adding them later
# needs no workflow change.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

env:
  # One place for the version: the tag, or what a manual run typed.
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # tar.gz (an install script) and deb. Writing the version into viva.toml
      # keeps the package metadata and the tag in step; the file stays the
      # source of truth for everything else.
      # The one place the version is set: it writes viva.toml (the package
      # metadata) and main.go (what the program prints for --version), so the
      # two cannot disagree.
      - name: Set the version
        run: tools/setversion.sh "${VERSION}"

      - name: Package
        run: go tool viva package --target linux --arch ${{ matrix.arch }} --format tar.gz,deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/*.tar.gz
            build/*.deb

  # Windows: build both programs, have SignPath sign them in ONE signing request
  # (one approval per release), then zip the signed programs.
  #
  # SignPath (free for open source through the SignPath Foundation) only signs
  # what a GitHub-hosted runner built and uploaded as a workflow artifact: the
  # action hands SignPath the artifact id, SignPath fetches it from GitHub,
  # verifies which repository, workflow, commit and runner produced it, signs
  # the .exe files inside (see .signpath/artifact-configuration.xml) and the
  # action downloads the result. No certificate or private key ever touches
  # this repository or the runner.
  #
  # Signing is skipped (and the release ships unsigned, as before) until the
  # SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable exist;
  # see docs/code-signing.md.
  windows:
    name: windows (build, sign, package)
    runs-on: ubuntu-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The one place the version is set: it writes viva.toml (the package
      # metadata and the version resource in the .exe) and main.go (what the
      # program prints for --version), so the two cannot disagree.
      - name: Set the version
        run: tools/setversion.sh "${VERSION}"

      - name: Build the programs
        run: |
          for arch in amd64 arm64; do
            go tool viva build --target windows --arch "$arch"
          done
          mkdir -p unsigned
          mv build/cetone-windows-*.exe unsigned/
          ls -l unsigned

      # The artifact SignPath fetches. Its id, not its name, is what the
      # signing request refers to.
      - name: Upload the unsigned programs
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Sign with SignPath
        id: signpath
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'cetone' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A release-signing policy waits for a person to approve the request
          # in SignPath; give them time instead of failing after ten minutes.
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed

      - name: Check the signatures
        if: steps.signpath.outcome == 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
          for exe in signed/*.exe; do
            echo "== $exe"
            osslsigncode verify -in "$exe" | grep -E 'Signer|Subject|Signature verification' || true
            # A file that came back unsigned must fail the release, not ship.
            osslsigncode extract-signature -in "$exe" -out "$RUNNER_TEMP/sig.der" >/dev/null
          done

      - name: Use the unsigned programs
        if: steps.signpath.outcome != 'success'
        run: |
          echo "::warning::SignPath is not configured: the Windows programs are NOT signed (see docs/code-signing.md)"
          mkdir -p signed
          cp unsigned/*.exe signed/

      # The zip holds just cetone.exe; --program packages the signed file
      # as it is instead of building (and so unsigning) it again.
      - name: Package
        run: |
          for arch in amd64 arm64; do
            go tool viva package --target windows --arch "$arch" --format zip \
              --no-sign --program "signed/cetone-windows-$arch.exe"
          done
          ls -l build/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.zip

  macos:
    name: macos ${{ matrix.arch }}
    # The only host that can build it; see the comment at the top.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set the version
        run: tools/setversion.sh "${VERSION}"

      # .app in a zip is what a user without a Developer ID can open with a
      # right click; a .dmg needs no signing either but is one more thing to
      # unverified-mount. Both are built when a signing identity exists, because
      # then the bundle is one Gatekeeper accepts.
      - name: Package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ] || [ -n "$APPLE_CERTIFICATE" ]; then
            go tool viva package --target darwin --arch ${{ matrix.arch }} --format app,zip,dmg
          else
            echo "no signing identity configured: building an unsigned bundle"
            go tool viva package --target darwin --arch ${{ matrix.arch }} --format zip --no-sign
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            build/*.zip
            build/*.dmg

  publish:
    name: publish the release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what is being published
        run: |
          echo "version: $VERSION"
          find artifacts -type f -printf "%s  %p\n" | sort -k2

      - name: Checksums
        run: |
          cd artifacts
          # A reader downloads an archive and can check it against this file.
          find . -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.zip' -o -name '*.dmg' \) -printf "%f\n" \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      # Re-running a failed release finds the assets a previous run attached;
      # this replaces them rather than failing.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$VERSION"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "replacing the existing release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          fi
          # A manual run has no tag yet: create it at the commit being released.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          # The asset list is built from what was actually produced: an unsigned
          # macOS job writes a zip and no dmg, and a glob that matches nothing
          # would fail the release.
          assets=$(find artifacts -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.zip' \
               -o -name '*.dmg' -o -name 'SHA256SUMS' \) -print | sort)
          if [ -z "$assets" ]; then echo "no assets to publish"; exit 1; fi
          echo "publishing:"
          echo "$assets"
          # shellcheck disable=SC2086
          gh release create "$tag" --title "Cetone $tag" --generate-notes $assets
